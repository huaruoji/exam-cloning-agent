[project]
name = "exam-cloner-backend"
version = "0.5.2"
description = "FastAPI backend for Exam Cloner"
requires-python = ">=3.10"
dependencies = [
  "aiofiles==24.1.0",
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "pdfplumber==0.11.6",
  "pydantic==2.11.4",
  "python-dotenv==1.1.0",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.34.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.25"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
